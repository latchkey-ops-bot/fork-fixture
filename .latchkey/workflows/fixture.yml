# AF1 fork fixture, changed for one live leg and returned after it: on this
# commit a push of main matches no file, and a push of legs/v6-run runs hello.
on:
  push:
    branches: ['legs/v6-run']
jobs:
  hello:
    runs-on: small
    timeout-minutes: 5
    steps:
      - name: say where it ran
        run: echo "af1-fork-fixture repository=$LATCHKEY_CI_REPOSITORY sha=$LATCHKEY_CI_SHA ref=$LATCHKEY_CI_REF fork=$LATCHKEY_CI_FORK run=$LATCHKEY_CI_RUN_ID"
